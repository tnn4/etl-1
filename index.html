<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Weather Alerts - SQLite Reader</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 2rem;
      }
      h1 {
        color: #38bdf8;
      }
      #status {
        font-weight: bold;
        margin-bottom: 1rem;
        color: #facc15;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 1rem;
        background: #1e293b;
      }
      th,
      td {
        border: 1px solid #334155;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #334155;
        color: #38bdf8;
      }
      tr:nth-child(even) {
        background-color: #0f172a;
      }
    </style>

    <!-- Load official sql.js WASM library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  </head>
  <body>
    <h1>Weather Alerts Data (updates hourly)</h1>
    <!-- Next Refresh Timer Display -->
    <div
      id="timer-container"
      style="
        background: #1e293b;
        color: #38bdf8;
        padding: 12px;
        border-radius: 6px;
        font-family: monospace;
        display: inline-block;
        margin-bottom: 1rem;
      "
    >
      ⏱️ Next scheduled data refresh in:
      <span id="countdown-timer" style="font-weight: bold; color: #facc15"
        >--:--</span
      >
    </div>
    <div id="status">Initializing SQLite WASM engine...</div>

    <table id="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Event</th>
          <th>Severity</th>
          <th>Area</th>
          <th>Timestamp</th>
        </tr>
      </thead>

      <!-- Custom SQL Query Box -->
      <h2>Interactive SQL Console</h2>
      <div
        style="
          margin-top: 2rem;
          padding: 1rem;
          background: #1e293b;
          border-radius: 8px;
        "
      >
        <textarea
          id="sql-input"
          rows="3"
          style="
            width: 100%;
            background: #0f172a;
            color: #38bdf8;
            padding: 10px;
            font-family: monospace;
          "
          placeholder="SELECT * FROM alerts WHERE severity = 'Severe';"
        ></textarea>
        <br />
        <button
          id="run-query-btn"
          style="
            margin-top: 8px;
            padding: 8px 16px;
            background: #0284c7;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
          "
        >
          Execute Query
        </button>
      </div>

      <!-- Output Container for Custom Queries -->
      <h2>Table alerts</h2>
      <div id="custom-output-container" style="margin-top: 1rem"></div>

      <tbody id="table-body"></tbody>
    </table>

    <script src="index.js"></script>
  </body>
</html>
